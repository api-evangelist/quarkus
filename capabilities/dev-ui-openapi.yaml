naftiko: 1.0.0-alpha2
info:
  label: Quarkus Dev UI & Health/Metrics API — OpenAPI
  description: 'Quarkus Dev UI & Health/Metrics API — OpenAPI. 2 operations. Lead operation: Quarkus OpenAPI document. Self-contained
    Naftiko capability covering one Quarkus business surface.'
  tags:
  - Quarkus
  - OpenAPI
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUARKUS_API_KEY: QUARKUS_API_KEY
capability:
  consumes:
  - type: http
    namespace: dev-ui-openapi
    baseUri: http://localhost:8080
    description: Quarkus Dev UI & Health/Metrics API — OpenAPI business capability. Self-contained, no shared references.
    resources:
    - name: q-openapi
      path: /q/openapi
      operations:
      - name: getopenapi
        method: GET
        description: Quarkus OpenAPI document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: format
          in: query
          type: string
          description: Response format
    - name: q-swagger-ui
      path: /q/swagger-ui
      operations:
      - name: getswaggerui
        method: GET
        description: Quarkus Swagger UI
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: dev-ui-openapi-rest
    port: 8080
    description: REST adapter for Quarkus Dev UI & Health/Metrics API — OpenAPI. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/q/openapi
      name: q-openapi
      description: REST surface for q-openapi.
      operations:
      - method: GET
        name: getopenapi
        description: Quarkus OpenAPI document
        call: dev-ui-openapi.getopenapi
        with:
          format: rest.format
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/q/swagger-ui
      name: q-swagger-ui
      description: REST surface for q-swagger-ui.
      operations:
      - method: GET
        name: getswaggerui
        description: Quarkus Swagger UI
        call: dev-ui-openapi.getswaggerui
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dev-ui-openapi-mcp
    port: 9090
    transport: http
    description: MCP adapter for Quarkus Dev UI & Health/Metrics API — OpenAPI. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: quarkus-openapi-document
      description: Quarkus OpenAPI document
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dev-ui-openapi.getopenapi
      with:
        format: tools.format
      outputParameters:
      - type: object
        mapping: $.
    - name: quarkus-swagger-ui
      description: Quarkus Swagger UI
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dev-ui-openapi.getswaggerui
      outputParameters:
      - type: object
        mapping: $.
