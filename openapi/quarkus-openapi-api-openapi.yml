openapi: 3.0.3
info:
  title: Quarkus & Health/Metrics Dev UI OpenAPI API
  description: Quarkus exposes management endpoints for health checks (via SmallRye Health), metrics (via Micrometer/SmallRye Metrics), and OpenAPI documentation. In dev mode, the Dev UI provides a web console with additional introspection endpoints. These endpoints are served under the /q path by default.
  version: 3.17.0
  contact:
    name: Quarkus Team
    url: https://quarkus.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080
  description: Default Quarkus development server
tags:
- name: OpenAPI
paths:
  /q/openapi:
    get:
      operationId: getOpenAPI
      summary: Quarkus OpenAPI document
      description: Returns the auto-generated OpenAPI specification for the application
      tags:
      - OpenAPI
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - yaml
        description: Response format
      responses:
        '200':
          description: OpenAPI specification document
          content:
            application/json:
              schema:
                type: object
            application/yaml:
              schema:
                type: object
  /q/swagger-ui:
    get:
      operationId: getSwaggerUI
      summary: Quarkus Swagger UI
      description: Serves the Swagger UI for interactive API exploration (dev mode or when always-include is true)
      tags:
      - OpenAPI
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string
